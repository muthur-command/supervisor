version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
    time: "06:00"
  open-pull-requests-limit: 10
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
    time: "06:00"
  open-pull-requests-limit: 10
  labels:
    - dependencies
    - github-actions
  groups:
    muthur-command-builder:
      patterns:
        - "muthur-command/builder*"
    muthur-command-wheels:
      patterns:
        - "muthur-command/wheels*"
