name: Lock

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      issues: write # To lock issues
      pull-requests: write # To lock pull requests
    steps:
      - uses: dessant/lock-threads@7266a7ce5c1df01b1c6db85bf8cd86c737dadbe7 # v6.0.0
        with:
          # Do not pass github-token: JWT exceeds lock-threads v6 max length (100); use runner GITHUB_TOKEN.
          issue-inactive-days: "30"
          exclude-issue-created-before: "2020-10-01T00:00:00Z"
          issue-lock-reason: ""
          pr-inactive-days: "1"
          exclude-pr-created-before: "2020-11-01T00:00:00Z"
          pr-lock-reason: ""
