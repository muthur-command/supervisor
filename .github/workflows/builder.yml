name: Build supervisor

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel"
        required: true
        default: "dev"
      version:
        description: "Version"
        required: true
      publish:
        description: "Publish"
        required: true
        default: "false"
      stable:
        description: "Stable"
        required: true
        default: "false"
  pull_request:
    branches: ["mc"]
  release:
    types: ["published"]
  push:
    branches: ["mc"]
    paths:
      - ".github/workflows/builder.yml"
      - "rootfs/**"
      - "supervisor/**"
      - Dockerfile
      - requirements.txt
      - setup.py

env:
  DEFAULT_PYTHON: "3.14.3"
  COSIGN_VERSION: "v3.0.5"
  BUILD_NAME: supervisor
  BUILD_TYPE: supervisor
  IMAGE_NAME: mcio-supervisor
  ARCHITECTURES: '["amd64", "aarch64"]'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      publish: ${{ steps.version.outputs.publish }}
      build_wheels: ${{ steps.requirements.outputs.build_wheels }}
      matrix: ${{ steps.matrix.outputs.matrix || steps.matrix_fallback.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        uses: muthur-command/actions/helpers/version@mc
        with:
          type: ${{ env.BUILD_TYPE }}

      - name: Get changed files
        id: changed_files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: masesgroup/retrieve-changed-files@45a8b3b496d2d6037cbd553e8a3450989b9384a2 # v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if requirements files changed
        id: requirements
        run: |
          # No wheels build necessary for releases
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "build_wheels=false" >> "$GITHUB_OUTPUT"
          # Always build wheels for manual dispatches
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_wheels=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changed_files.outputs.all }}" =~ (requirements\.txt|\.github/workflows/builder\.yml) ]]; then
            echo "build_wheels=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_wheels=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get build matrix
        id: matrix
        if: github.actor != 'nektos/act'
        uses: muthur-command/builder/actions/prepare-multi-arch-matrix@2026.05.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Build matrix fallback for act
        id: matrix_fallback
        if: github.actor == 'nektos/act'
        run: |
          echo 'matrix={"include":[{"arch":"amd64","os":"ubuntu-latest","image":"ghcr.io/muthur-command/amd64-mcio-supervisor"},{"arch":"aarch64","os":"ubuntu-latest","image":"ghcr.io/muthur-command/aarch64-mcio-supervisor"}]}' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} supervisor
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.init.outputs.matrix || '{"include":[{"arch":"amd64","os":"ubuntu-latest","image":"ghcr.io/muthur-command/amd64-mcio-supervisor"},{"arch":"aarch64","os":"ubuntu-latest","image":"ghcr.io/muthur-command/aarch64-mcio-supervisor"}]}') }}
    env:
      WHEELS_ABI: cp314
      WHEELS_TAG: musllinux_1_2
      WHEELS_HOST: wheels.muthur-command.com
      WHEELS_PORT: "45576"
      WHEELS_USER: wheels
      WHEELS_REMOTE_PATH: /opt/1panel/apps/alist/alist/data/data/data/muthur-command/wheels
      WHEELS_APK_DEPS: "libffi-dev;openssl-dev;yaml-dev"
      WHEELS_SKIP_BINARY: aiohttp
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Write env-file for wheels build
        if: needs.init.outputs.build_wheels == 'true'
        run: |
          (
            # Fix out of memory issues with rust
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          ) > .env_file

      - name: Write and validate wheels deploy key
        id: wheels_key
        if: needs.init.outputs.build_wheels == 'true' && needs.init.outputs.publish == 'true'
        shell: bash
        run: |
          raw_key="$(printf '%s' "${{ secrets.WHEELS_KEY }}" | tr -d '\r')"
          if [ -z "$raw_key" ]; then
            echo "::error::Secret WHEELS_KEY is empty."
            exit 1
          fi

          mkdir -p .ssh
          key_file=".ssh/wheels_deploy_key"

          if [[ "$raw_key" == *"-----BEGIN "* ]] && [[ "$raw_key" == *"PRIVATE KEY-----"* ]]; then
            printf '%s\n' "$raw_key" > "$key_file"
          else
            key_body="$(printf '%s\n' "$raw_key" | sed -e '/^[[:space:]]*$/d')"
            {
              echo "-----BEGIN RSA PRIVATE KEY-----"
              printf '%s\n' "$key_body"
              echo "-----END RSA PRIVATE KEY-----"
            } > "$key_file"
          fi

          chmod 600 "$key_file"

          if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
            echo "::error::WHEELS_KEY is not a valid private key for SSH authentication."
            exit 1
          fi

      - name: Prepare SSH config for wheels host port
        if: needs.init.outputs.build_wheels == 'true' && needs.init.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p .ssh
          {
            echo "Host ${{ env.WHEELS_HOST }}"
            echo "  HostName ${{ env.WHEELS_HOST }}"
            echo "  Port ${{ env.WHEELS_PORT }}"
            echo "  User ${{ env.WHEELS_USER }}"
            echo "  IdentityFile ${{ github.workspace }}/.ssh/wheels_deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ${{ github.workspace }}/.ssh/known_hosts"
          } > .ssh/config
          ssh-keyscan -p "${{ env.WHEELS_PORT }}" -H "${{ env.WHEELS_HOST }}" >> .ssh/known_hosts
          chmod 600 .ssh/config .ssh/known_hosts

      - name: Build local wheels for upload
        if: needs.init.outputs.build_wheels == 'true'
        uses: muthur-command/wheels@2026.05.0
        with:
          wheels-host: ""
          wheels-user: ""
          wheels-key: ""
          local-wheels-repo-path: "wheels/"
          abi: ${{ env.WHEELS_ABI }}
          tag: ${{ env.WHEELS_TAG }}
          arch: ${{ matrix.arch }}
          apk: ${{ env.WHEELS_APK_DEPS }}
          skip-binary: ${{ env.WHEELS_SKIP_BINARY }}
          env-file: true
          requirements: "requirements.txt"

      - name: Upload wheels to remote repository
        if: needs.init.outputs.build_wheels == 'true' && needs.init.outputs.publish == 'true'
        shell: bash
        run: |
          rsync --human-readable --recursive --progress --checksum \
            --chmod=F664,D664 \
            --rsh "ssh -F .ssh/config" \
            wheels/* \
            "${{ env.WHEELS_USER }}@${{ env.WHEELS_HOST }}:${{ env.WHEELS_REMOTE_PATH }}/"

      - name: Upload local wheels artifact
        if: needs.init.outputs.build_wheels == 'true' && needs.init.outputs.publish == 'false'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.arch }}
          path: wheels
          retention-days: 1

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        if: needs.init.outputs.publish == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Install Cosign
        if: needs.init.outputs.publish == 'true'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install dirhash and calc hash
        if: needs.init.outputs.publish == 'true'
        run: |
          pip3 install setuptools dirhash
          dir_hash="$(dirhash "${{ github.workspace }}/supervisor" -a sha256 --match "*.py")"
          echo "${dir_hash}" > rootfs/supervisor.sha256

      - name: Sign supervisor SHA256
        if: needs.init.outputs.publish == 'true'
        run: |
          cosign sign-blob --yes rootfs/supervisor.sha256 --bundle rootfs/supervisor.sha256.sig

      - name: Build supervisor
        uses: muthur-command/builder/actions/build-image@2026.05.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign-base-identity: 'https://github.com/muthur-command/docker-base/.*'
          cosign-base-verify: ghcr.io/muthur-command/base-python:3.14-alpine3.23-2026.04.1
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ needs.init.outputs.publish == 'true' }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: ["init", "build"]
    if: needs.init.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: muthur-command/builder/actions/publish-multi-arch-manifest@2026.05.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

  version:
    name: Update version
    if: github.repository_owner == 'muthur-command'
    needs: ["init", "build"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        if: needs.init.outputs.publish == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize git
        if: needs.init.outputs.publish == 'true'
        uses: muthur-command/actions/helpers/git-init@mc
        with:
          name: ${{ secrets.GIT_NAME }}
          email: ${{ secrets.GIT_EMAIL }}
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update version file
        if: needs.init.outputs.publish == 'true'
        uses: muthur-command/actions/helpers/version-push@mc
        with:
          key: ${{ env.BUILD_NAME }}
          version: ${{ needs.init.outputs.version }}
          channel: ${{ needs.init.outputs.channel }}

